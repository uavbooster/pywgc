name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test py${{ matrix.python }}
    # pywgc 只支持 Windows，必须在 Windows runner 上跑；测试本身不需要真实窗口。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show environment
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          python -c "import pywgc; print('pywgc', pywgc.__version__, pywgc.available_backends())"

      - name: Test
        run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  package:
    name: build & twine check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify wheel contents
        run: |
          python -c "import glob, zipfile; p = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(p).namelist(); print('\n'.join(names)); assert any(n.endswith('pywgc/py.typed') for n in names), 'py.typed missing'"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
